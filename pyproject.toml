[project]
name = "ytdlparr"
version = "0.1.0"
description = "SABnzbd-shaped download client that fetches with yt-dlp"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
    "waitress>=3.0",
    "yt-dlp",
]

[project.scripts]
ytdlparr = "ytdlparr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
