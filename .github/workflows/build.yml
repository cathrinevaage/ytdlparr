# Rebuilds the image against the newest yt-dlp release.
#
# Triggered by workflow_dispatch only - never schedule: - because
# GitHub disables scheduled workflows after 60 days of repository
# inactivity. A cron of your own (scripts/dispatch-rebuild.sh) calls
# the dispatch API; the build still runs on GitHub's runners.
name: build

on:
  workflow_dispatch:
    inputs:
      ytdlp_version:
        description: yt-dlp version to bake in (empty = latest on PyPI)
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ytdlp_version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ inputs.ytdlp_version }}" ]; then
            version="${{ inputs.ytdlp_version }}"
          else
            version=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "yt-dlp $version"

  smoke:
    # An automated rebuild that ships a broken yt-dlp is worse than a
    # stale one. This proves the release installs, imports and
    # extracts. Any site-specific check belongs in the dispatch script,
    # run from a network that can reach that site.
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yt-dlp==${{ needs.resolve.outputs.ytdlp_version }}"
      - run: |
          python - <<'PY'
          import yt_dlp
          from yt_dlp.postprocessor import FFmpegPostProcessor
          assert FFmpegPostProcessor().available, "ffmpeg missing on runner"
          with yt_dlp.YoutubeDL({"quiet": True, "simulate": True}) as ydl:
              info = ydl.extract_info(
                  "https://archive.org/details/BigBuckBunny_124", download=False
              )
          assert info.get("formats"), "no formats extracted"
          print("ok:", info.get("title"), len(info["formats"]), "formats")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask pyyaml yt-dlp apprise
      - run: python -m unittest discover -s tests -t .

  build:
    needs: [resolve, smoke, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            YTDLP_VERSION=${{ needs.resolve.outputs.ytdlp_version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:ytdlp-${{ needs.resolve.outputs.ytdlp_version }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
